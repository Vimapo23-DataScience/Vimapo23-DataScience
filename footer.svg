<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a6b"/>
      <stop offset="1" stop-color="#5b2a86"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="100" fill="url(#bg)"/>
  <circle cx="200" cy="50" r="45" fill="#ffffff" opacity="0.06">
    <animate attributeName="cy" values="50;70;50" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="60" r="55" fill="#ffffff" opacity="0.05">
    <animate attributeName="cy" values="60;40;60" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
